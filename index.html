<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><style>body{font-family:sans-serif;max-width:800px;margin:2rem auto;padding:0 1rem}.controls{display:flex;gap:10px;margin-bottom:20px}input{padding:8px;border:1px solid #ccc;flex-grow:1}#output,button,input{border-radius:4px}button{padding:8px 16px;background:#007bff;color:#fff;border:0;cursor:pointer}#output{white-space:pre-wrap;word-break:break-all;background:#f4f4f4;padding:15px;border:1px solid #ddd;max-height:400px;overflow-y:auto}.stats{font-size:.9rem;color:#666;margin-bottom:10px}</style></head><body><h2>Factorial Calc</h2><div class="controls"><input type="number" id="inputN" value="20000"> <button onclick="rf()">Calculate</button></div><div class="stats" id="stats">Digits: 0 | Time: 0ms</div><div id="output">Result will appear here...</div><script>function cf(n){if(n<2)return"1";function b(l,h){if(l===h)return BigInt(l);if(h-l===1)return BigInt(l)*BigInt(h);let m=Math.floor((l+h)/2);return b(l,m)*b(m+1,h)}return b(1,n).toString()}function rf(){const e=parseInt(document.getElementById("inputN").value),t=document.getElementById("output"),n=document.getElementById("stats");isNaN(e)||e<0?t.innerText="Error":(t.innerText="Calculating...",setTimeout(()=>{const o=performance.now(),r=cf(e),l=performance.now();n.innerText=`Digits: ${r.length} | Time: ${(l-o).toFixed(2)}ms`,t.innerText=r},100))}</script></body></html>
